name: build_conteneur.yml
on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Exo_2_docker/Dockerfile
          load: true
          push: false
          tags: calcul:latest
      - run: docker run --rm calcul:latest python3 calcul.py