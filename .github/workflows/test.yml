name: Tests Unitaires Python

on:
  # Permet le déclenchement manuel
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Récupérer le code (Checkout)
      uses: actions/checkout@v4

    - name: Configurer Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Accélère les exécutions futures

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Exécuter les tests avec pytest
      run: |
        pytest --maxfail=1 --disable-warnings -q